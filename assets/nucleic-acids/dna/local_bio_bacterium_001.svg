<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Flagella tails -->
  <path d="M 35,80 C 10,70 15,100 -10,90 C -25,85 -30,110 -50,105" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M 35,90 C 5,110 20,130 -10,140" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <!-- Capsule Body -->
  <rect x="40" y="35" width="160" height="90" rx="45" fill="url(#bactGrad)" stroke="#064e3b" stroke-width="6" />
  <!-- Inner cytoplasm -->
  <rect x="48" y="43" width="144" height="74" rx="37" fill="#a7f3d0" stroke="#059669" stroke-width="2" />
  <!-- Nucleoid DNA loop -->
  <path d="M 80,75 Q 100,55 120,70 T 155,75 T 130,95 T 90,85 Z" fill="none" stroke="#047857" stroke-width="3.5" stroke-dasharray="6 2" />
  <!-- Plasmids -->
  <circle cx="165" cy="65" r="7" fill="none" stroke="#047857" stroke-width="2" />
  <!-- Ribosomes -->
  <circle cx="75" cy="60" r="2" fill="#064e3b" />
  <circle cx="105" cy="95" r="2" fill="#064e3b" />
  <circle cx="140" cy="60" r="2" fill="#064e3b" />
  <circle cx="155" cy="95" r="2" fill="#064e3b" />
  <!-- Pili spikes -->
  <line x1="120" y1="35" x2="120" y2="20" stroke="#059669" stroke-width="2" />
  <line x1="150" y1="38" x2="158" y2="23" stroke="#059669" stroke-width="2" />
  <line x1="90" y1="38" x2="82" y2="23" stroke="#059669" stroke-width="2" />
  <line x1="120" y1="125" x2="120" y2="140" stroke="#059669" stroke-width="2" />
  <line x1="150" y1="122" x2="158" y2="137" stroke="#059669" stroke-width="2" />
  <line x1="90" y1="122" x2="82" y2="137" stroke="#059669" stroke-width="2" />
</svg>